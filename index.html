<title>Поиск машин — Forza Horizon 6</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --accent:#ff5b2e; --blue:#4da3ff;
    --text:#f2f2f2; --muted:#9aa0ab; --border:#2c3038;
  }
  *{box-sizing:border-box;}
  
  html { background-color: var(--bg); min-height: 100%; }
  body{
    margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #1c2028, #0f1115 70%) no-repeat fixed;
    background-size: cover;
    color: var(--text); min-height:100vh;
  }
  
  header{ padding: 28px 20px 12px; text-align:center; }
  header h1{ margin:0 0 6px; font-size:26px; }
  header p{ margin:0; color: var(--muted); font-size:14px; }

  .toolbar{
    max-width: 950px; margin: 16px auto 4px; padding: 0 20px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  #search{
    flex:1; min-width:200px; padding: 13px 16px; font-size:16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); outline:none;
  }
  #search:focus{ border-color: var(--accent); }

  .btn{
    padding: 12px 14px; border-radius: 12px; border:1px solid var(--border);
    background: var(--card); color: var(--text); cursor:pointer; font-size:13px;
    white-space:nowrap; transition: border-color 0.15s, color 0.15s;
  }
  .btn:hover{ border-color:#3a3f48; }
  .btn.active{ border-color: var(--blue); color: var(--blue); }

  .count{
    max-width: 950px; margin: 0 auto 18px; padding: 0 20px;
    color: var(--muted); font-size:13px; text-align:right;
  }
  .grid{
    max-width: 1100px; margin: 0 auto; padding: 0 20px 60px;
    display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px;
  }
  .car-card{
    background: var(--card); border-radius: 12px; overflow:hidden;
    border: 1px solid #262a32; position:relative; transition: border-color 0.15s;
  }
  .car-card.priced{ border-color: var(--blue); }

  .car-photo, .car-photo-placeholder{
    width:100%; height:140px; object-fit:cover; display:block; background:#0d0f13;
  }
  .car-photo-placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size:40px; color:#33384299;
  }
  .car-body{ padding: 12px 14px 14px; }
  .car-year{ color: var(--accent); font-size:13px; font-weight:600; }
  .car-name{ font-size:15px; margin-top:4px; line-height:1.3; }

  .price-row{ margin-top:10px; display:flex; align-items:center; gap:8px; }
  .price-label{ font-size:12.5px; color: var(--muted); white-space:nowrap; }
  .price-input{
    flex:1; min-width:0; padding: 8px 10px; font-size:14px; border-radius: 8px;
    border: 1px solid #3a3f48; background:#20242c; color: var(--text); outline:none;
    -moz-appearance: textfield;
  }
  .price-input::-webkit-outer-spin-button,
  .price-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .price-input:focus{ border-color: var(--blue); }
  .car-card.priced .price-label{ color: var(--blue); }

  .empty{ text-align:center; color: var(--muted); padding: 60px 20px; font-size:15px; }

  @media (max-width: 520px){
    header h1{ font-size:20px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:10px; padding: 0 12px 40px; }
    .car-photo, .car-photo-placeholder{ height: 110px; }
    .toolbar, .count{ padding: 0 12px; }
  }
</style>
</head>

function parseCar(name){ const m=name.match(/^(\d{3,4})\s+(.*)$/); return {year:m?m[1]:'',title:m?m[2]:name}; }
// Функция для красивого отображения (ставит точки)
function formatPrice(val) {
  if (val === null || val === undefined || val === '') return '';
  const numStr = String(val).replace(/\D/g, ''); // Оставляем только цифры
  return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); // Ставим точки
}

// Функция для извлечения чистого числа (убирает точки)
function parsePrice(val) {
  if (!val) return null;
  const num = parseInt(String(val).replace(/\D/g, ''), 10);
  return isNaN(num) ? null : num;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const debounce=(fn,ms=120)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

// Normalize car and Wiki file names for matching (ignores punctuation, accents and FH6 prefix).
function normalizePhotoName(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/^file:/,'').replace(/^fh6[_\s-]*/,'').replace(/\.(png|jpe?g|webp)$/i,'')
    .replace(/[™®©]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function carPhotoKey(name){
  const {title}=parseCar(name);
  return normalizePhotoName(title);
}
function loadCachedWikiIndex(){
  try{
    const cached=JSON.parse(localStorage.getItem(PHOTO_INDEX_KEY)||'null');
    if(cached && cached.savedAt && Date.now()-cached.savedAt<PHOTO_INDEX_TTL && cached.entries){
      wikiPhotoMap=new Map(cached.entries); return true;
    }
  }catch(e){}
  return false;
}
function apiUrl(params){
  const u=new URL('https://forza.fandom.com/api.php');
  for(const [k,v] of Object.entries(params)) u.searchParams.set(k,v);
  u.searchParams.set('origin','*');
  return u.toString();
}
async function fetchWikiPhotoIndex(){
  if(wikiIndexPromise) return wikiIndexPromise;
  wikiIndexPromise=(async()=>{
    if(loadCachedWikiIndex()) return wikiPhotoMap;
    const files=[]; let continuation=null;
    try{
      do{
        const params={action:'query',generator:'categorymembers',gcmtitle:'Category:Thumbnails (FH6)',gcmtype:'file',gcmlimit:'500',prop:'imageinfo',iiprop:'url',iiurlwidth:'640',format:'json',formatversion:'2'};
        if(continuation) Object.assign(params,continuation);
        const response=await fetch(apiUrl(params));
        if(!response.ok) throw new Error('Wiki API HTTP '+response.status);
        const data=await response.json();
        for(const page of Object.values(data.query?.pages||[])){
          const info=page.imageinfo?.[0];
          if(info) files.push({title:page.title, url:info.thumburl||info.url});
        }
        continuation=data.continue||null;
      }while(continuation);
      const map=new Map();
      for(const file of files){
        const key=normalizePhotoName(file.title);
        if(key && file.url && !map.has(key)) map.set(key,file.url);
      }
      // Map filenames to car names, allowing the common FH6 filename variants.
      for(const car of cars){
        const {year,title}=parseCar(car);
        const exacts=[title,`FH6 ${title}`,`${title} ${year}`,`FH6 ${title} ${year}`].map(normalizePhotoName);
        let found=null;
        for(const key of exacts){ if(map.has(key)){found=map.get(key);break;} }
        // Wiki file titles often reorder race numbers or omit years. Match normalized token sets,
        // but require all meaningful car-name tokens to avoid assigning a photo to a different model.
        if(!found){
          const wanted=normalizePhotoName(title).split(' ').filter(Boolean);
          const wantedSet=[...new Set(wanted)].sort().join(' ');
          for(const [fileKey,url] of map){
            const tokens=normalizePhotoName(fileKey).replace(/^fh6\s+/,'').split(' ').filter(Boolean);
            const candidateSet=[...new Set(tokens)].sort().join(' ');
            if(candidateSet===wantedSet){found=url;break;}
            // Allow a year token in the Wiki filename, but no other extra model tokens.
            const withoutYear=tokens.filter(t=>!/^\d{4}$/.test(t));
            if([...new Set(withoutYear)].sort().join(' ')==wantedSet){found=url;break;}
          }
        }
        if(found) wikiPhotoMap.set(car,found);
      }
      try{localStorage.setItem(PHOTO_INDEX_KEY,JSON.stringify({savedAt:Date.now(),entries:[...wikiPhotoMap]}));}catch(e){}
      return wikiPhotoMap;
    }catch(error){
      console.warn('Forza Wiki API photo index failed; local images will be used.',error);
      return wikiPhotoMap;
    }
  })();
  return wikiIndexPromise;
}
function makePlaceholder(){const d=document.createElement('div');d.className='car-photo-placeholder';d.textContent='🚗';return d;}
function localPhotoCandidates(name){
  const {year,title}=parseCar(name);
  const variants=new Set([title,`FH6 ${title}`,`${title} ${year}`,`FH6 ${title} ${year}`]);
  const out=[];
  for(const v of variants) for(const ext of LOCAL_EXTENSIONS) out.push(LOCAL_PHOTO_FOLDER+encodeURIComponent(v+'.'+ext).replace(/%20/g,'%20'));
  return out;
}
function makePhoto(name,title){
  const img=document.createElement('img');img.className='car-photo';img.alt=title;img.loading='lazy';img.decoding='async';
  let localCandidates=localPhotoCandidates(name),localIndex=0,usedLocal=false;
  const tryLocal=()=>{if(localIndex<localCandidates.length){usedLocal=true;img.src=localCandidates[localIndex++];return;}img.replaceWith(makePlaceholder());};
  img.onerror=()=>{if(!usedLocal){tryLocal();}else if(localIndex<localCandidates.length){img.src=localCandidates[localIndex++];}else img.replaceWith(makePlaceholder());};
  // Online Wiki image is attempted first; local images/ is the fallback.
  const online=wikiPhotoMap.get(name);
  if(online){img.src=online;}else{tryLocal();}
  return img;
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  let list = cars.filter(c => {
    if(q && !c.toLowerCase().includes(q)) return false;
    if(pricedOnly && getPrice(c) === null) return false;
    return true;
  });

  if(sortMode !== 'none'){
    list.sort((a, b) => {
      const pa = getPrice(a), pb = getPrice(b);
      if(pa === null && pb === null) return a.localeCompare(b);
      if(pa === null) return 1;
      if(pb === null) return -1;
      return sortMode === 'asc' ? pa - pb : pb - pa;
    });
  }

  grid.innerHTML = '';
  countEl.textContent = `Показано: ${list.length} · С ценой: ${totalPriced()} из ${cars.length}`;

  if(!list.length){
    grid.innerHTML = '<div class="empty">Ничего не найдено 🙁</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  for(const name of list){
    const { year, title } = parseCar(name);
    const price = getPrice(name);

    const card = document.createElement('div');
    card.className = 'car-card' + (price !== null ? ' priced' : '');
    card.appendChild(makePhoto(name, title));

    const body = document.createElement('div');
    body.className = 'car-body';
    body.innerHTML = `
      <div class="car-year">${year}</div>
      <div class="car-name">${escapeHtml(title)}</div>
      <div class="price-row">
        <span class="price-label">Цена:</span>
               <input type="text" inputmode="numeric"
               class="price-input" placeholder="не указана"
               value="${price !== null ? formatPrice(price) : ''}">
      </div>
    `;
   const input = body.querySelector('.price-input');
    input.dataset.carId = name;
    input.readOnly = !canEditPrices();

   // 1. Автоматически ставим точки прямо во время ввода
   input.addEventListener('input', (e) => {
     if (!canEditPrices()) return;
     e.target.value = formatPrice(e.target.value);
   });

   // 2. Сохраняем цену при нажатии Enter или клике в сторону
   input.addEventListener('change', () => {
     if (!canEditPrices()) return;

     const rawValue = input.value;
     const price = parsePrice(rawValue); // Достаем чистое число (без точек)

     // Если поле пустое - удаляем цену из базы
     if (rawValue === '') {
       runPriceAction(async () => {
         await checkPriceRequest(
           priceDb.from('car_prices').delete().eq('car_id', name)
         );
         delete prices[name];
         return 'Цена удалена.';
       });
       return;
     }

     // Если ввели ерунду или число больше 2 147 483 647
     if (price === null || !validPrice(price)) {
       input.value = formatPrice(getPrice(name) ?? '');
       alert('Введи целую неотрицательную цену до 2 147 483 647.');
       return;
     }

     // Сохраняем в базу
     runPriceAction(async () => {
       await checkPriceRequest(
         priceDb.from('car_prices').upsert(
           { car_id: name, price },
           { onConflict: 'car_id' }
         )
       );
       prices[name] = price;
       return 'Цена сохранена.';
     });
   });

input.addEventListener('keydown', event => {
  if (event.key === 'Enter') input.blur();
});


    card.appendChild(body);
    frag.appendChild(card);
  }
  grid.appendChild(frag);
}

function validPrice(n) {
  return Number.isInteger(n) && n >= 0 && n <= 2147483647;

async function checkPriceRequest(request) {
  const { data, error } = await request;
  if (error) throw error;
  return data;
}

async function loadCloudPrices() {
  const loaded = Object.create(null);
  for (let offset = 0; ; ) {
    const rows = await checkPriceRequest(
      priceDb.from('car_prices')
        .select('car_id, price')
        .order('car_id')
        .range(offset, offset + 499)
    );
    if (!rows.length) break;
    for (const { car_id, price } of rows) {
      if (knownCars.has(car_id) && validPrice(price)) loaded[car_id] = price;
    }
    offset += rows.length;
  }
  prices = loaded;
  pricesLoaded = true;
}

async function runPriceAction(action) {
  if (priceBusy) return;
  priceBusy = true;
  updatePriceControls();
  priceStatus.textContent = 'Обращаюсь к базе цен…';

  try {
    priceStatus.textContent = await action();
  } catch (error) {
    priceStatus.textContent = 'Не удалось выполнить действие: ' + error.message;
  } finally {
    priceBusy = false;
    updatePriceControls();
    render();
  }
}

      .filter(([name, price]) => knownCars.has(name) && validPrice(price))
      .map(([car_id, price]) => ({ car_id, price }));

                             if (rows.length === 0) {
                  throw new Error('В файле нет валидных цен для машин из базы.');
